{% extends "books/base.html" %}

{% block content%}
<h1>{{book.title}}</h1>
<p><strong>Author:</strong>{{book.author}}</p>
<p><strong>Pages:</strong>{{book.pages}}</p>
<p><strong>Read:</strong>{%if book.read %}✅ Yes {%else%} No {%endif%}</p>
<p><strong>Added on:</strong>{{book.added}}</p>

<br>
<a href="{% url 'book_list' %}">Back</a>
{% endblock%}
